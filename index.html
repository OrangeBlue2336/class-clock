<!DOCTYPE html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" href="/class-clock/favicon/favicon-96x96.png?v=20260915" sizes="96x96" />
<link rel="icon" type="image/svg+xml" href="/class-clock/favicon/favicon.svg?v=20260915" />
<link rel="shortcut icon" href="/class-clock/favicon/favicon.ico?v=20260915" />
<link rel="apple-touch-icon" sizes="180x180" href="/class-clock/favicon/apple-touch-icon.png?v=20260915" />
<link rel="manifest" href="/class-clock/favicon/site.webmanifest?v=20260915" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학급 시계</title>
<link rel="preload" href="fonts/경기천년제목_M.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family: 'GyeonggiTitle';
    src: url('fonts/경기천년제목_M.woff2') format('woff2');
    font-weight: 500;
    font-style: normal;
    font-display: block;
  }

  :root{
    --bg: #12141b;
    --panel: #1a1d26;
    --line: #2b2f3c;
    --ink: #edf0f5;
    --ink-dim: #8791a6;
    --gold: #e3b34a;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'GyeonggiTitle', -apple-system, 'Malgun Gothic', sans-serif;
  }

  .board{
    position: relative;
    height: 100vh;
    padding: clamp(16px, 2.2vw, 40px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "dday    ."
      "clock   clock"
      "ghlink  .";
    row-gap: clamp(12px, 1.6vh, 28px);
    column-gap: 24px;
  }

  /* ---------- 현재 일과 (상단 중앙) ---------- */
  .status-panel{
    position: absolute;
    top: clamp(16px, 2.2vw, 40px);
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    padding: 8px 22px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
  }
  .status-label{
    display: block;
    font-size: 1.8rem;
    color: var(--ink-dim);
    margin-bottom: 2px;
  }
  .status-value{
    font-size: clamp(2.1rem, 1.3vw, 1.3rem);
    font-weight: 400;
    color: var(--ink);
  }

  /* ---------- D-day ---------- */
  .dday{
    grid-area: dday;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  .dday-value{
    font-size: clamp(1.8rem, 3.4vw, 3.2rem);
    font-weight: 300;
    color: var(--gold);
    letter-spacing: -0.02em;
  }
  .dday-caption{
    font-size: clamp(1.2rem, 1vw, 1.05rem);
    color: var(--ink-dim);
  }

  /* ---------- 공지 / 청소 패널 ---------- */
  .panels{
    position: absolute;
    top: clamp(16px, 2.2vw, 40px);
    right: clamp(16px, 2.2vw, 40px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(380px, 100%);
  }
  .panel{
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    padding: 14px 16px;
    cursor: pointer;
  }
  .panel-label{
    display: block;
    font-size: 1.0rem;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .panel-text{
    margin: 0;
    font-size: 1.6rem;
    line-height: 1.6;
    color: #ffffff;
    white-space: pre-wrap;
  }
  .panel-edit{
    width: 100%;
    min-height: 100px;
    resize: vertical;
    background: #10121a;
    color: #ffffff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px 10px;
    font: inherit;
    font-size: 1.1rem;
    line-height: 1.5;
  }
  .panel-controls{
    display: none;
    align-items: center;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .panel.open .panel-controls{ display: flex; }
  .icon-btn{
    background: none;
    border: none;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 0.85rem;
    padding: 5px 9px;
    border-radius: 4px;
    cursor: pointer;
  }
  .icon-btn:hover{ color: var(--ink); background: rgba(255,255,255,0.08); }
  .chevron-btn{
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- 시계 ---------- */
  .clock{
    grid-area: clock;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding-top: 48px;
  }
  .date{
    margin-bottom: clamp(8px, 1.2vh, 18px);
    font-size: clamp(1.8rem, 1.6vw, 1.7rem);
    color: var(--ink-dim);
  }
  .time-wrap{
    position: relative;
    display: inline-block;
  }
  .time{
    font-variant-numeric: tabular-nums;
    font-size: clamp(4.5rem, 15vw, 14rem);
    font-weight: 300;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .countdown{
    position: absolute;
    left: 4px;
    bottom: -1.6rem;
    font-size: clamp(2rem, 1vw, 1rem);
    font-variant-numeric: tabular-nums;
    color: var(--gold);
    white-space: nowrap;
  }
  .countdown.hidden,
  .next-class.hidden{
    display: none;
  }
  .next-class{
    margin-top: clamp(20px, 3vh, 40px);
    text-align: center;
  }
  .next-class-label{
    font-size: clamp(1.9rem, 1vw, 1.05rem);
    color: var(--ink-dim);
  }
  .next-class-value{
    margin-top: 4px;
    font-size: clamp(2.5rem, 2vw, 2rem);
    font-weight: 400;
    color: var(--ink);
  }

  /* ---------- 깃헙 링크 / 전체화면 ---------- */
  .ghlink{
    grid-area: ghlink;
    align-self: end;
    justify-self: start;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .ghlink a,
  .ghlink button{
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 0;
    padding-right: 15px;
    color: var(--ink-dim);
    cursor: pointer;
    transition: color 0.15s ease;
  }
  .ghlink a:hover,
  .ghlink button:hover{ color: var(--ink); }

  /* ---------- 급식 ---------- */
  .meal-panel{
    position: absolute;
    right: clamp(16px, 2.2vw, 40px);
    bottom: clamp(16px, 2.2vw, 40px);
    display: flex;
    align-items: flex-start;
    gap: 6px;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 8px;
    min-width: 220px;
    max-width: 280px;
    max-height: 42vh;
    overflow: hidden;
  }
  .meal-arrow{
    margin-top: 2px;
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 1.4rem;
    line-height: 1;
    padding: 6px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  .meal-arrow:hover{ color: var(--ink); background: rgba(255,255,255,0.08); }
  .meal-content{
    flex: 1;
    text-align: center;
  }
  .meal-content h3{
    margin: 0 0 6px;
    font-size: 2rem;
    font-weight: 400;
    color: var(--ink);
  }
  .meal-menu{
    margin: 0;
    font-size: 1.32rem;
    line-height: 1.55;
    color: var(--ink-dim);
  }
  .meal-menu div{
    white-space: normal;
  }
</style>
</head>
<body>

<div class="board">

  <div class="status-panel">
    <span class="status-label">현재 일과</span>
    <span id="statusValue" class="status-value">-</span>
  </div>

  <div class="dday">
    <span id="ddayValue" class="dday-value">D-00</span>
    <span id="ddayCaption" class="dday-caption"></span>
  </div>

  <div class="panels">
    <div class="panel" data-key="notice">
      <span class="panel-label">공지</span>
      <p class="panel-text" data-display></p>
      <textarea class="panel-edit" data-input hidden></textarea>
      <div class="panel-controls">
        <button class="icon-btn" data-edit type="button">수정</button>
        <button class="icon-btn chevron-btn" data-collapse type="button" aria-label="접기">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 9L7 4L12 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="panel" data-key="cleaning">
      <span class="panel-label">청소</span>
      <p class="panel-text" data-display></p>
      <textarea class="panel-edit" data-input hidden></textarea>
      <div class="panel-controls">
        <button class="icon-btn" data-edit type="button">수정</button>
        <button class="icon-btn chevron-btn" data-collapse type="button" aria-label="접기">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 9L7 4L12 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <main class="clock">
    <div id="date" class="date"></div>
    <div class="time-wrap">
      <div id="time" class="time">00:00:00</div>
      <div id="countdown" class="countdown"></div>
    </div>
    <div class="next-class">
      <div class="next-class-label">다음 일정</div>
      <div id="nextClassValue" class="next-class-value">-</div>
    </div>
  </main>

  <div class="ghlink">
    <a href="#" id="ghAnchor" target="_blank" rel="noopener" aria-label="깃헙 저장소 열기">
      <svg width="26" height="26" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8a8 8 0 0 0 5.47 7.59c.4.07.55-.17.55-.38
          0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
          -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
          .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
          -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.5 7.5 0 0 1 4 0c1.53-1.04
          2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15
          0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2
          0 .21.15.46.55.38A8 8 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
    </a>

    <button id="fullscreenBtn" type="button" aria-label="전체화면">
      <svg id="fsEnterIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
        <path d="M21 8V5a2 2 0 0 0-2-2h-3"/>
        <path d="M3 16v3a2 2 0 0 0 2 2h3"/>
        <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
      <svg id="fsExitIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
        <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
        <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
        <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
        <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
      </svg>
    </button>
  </div>

  <div class="meal-panel">
    <button class="meal-arrow" data-meal-nav type="button" aria-label="이전">‹</button>
    <div class="meal-content">
      <h3 id="mealLabel">중식</h3>
      <div class="meal-menu" id="mealMenu">불러오는 중...</div>
    </div>
    <button class="meal-arrow" data-meal-nav type="button" aria-label="다음">›</button>
  </div>

</div>

<script>
  const TARGET_DATE = "2026-11-19";

  // 깃헙 저장소 주소
  const REPO_URL = "https://github.com/OrangeBlue2336/class-clock";
  document.getElementById('ghAnchor').href = REPO_URL;

  // ---------- 전체화면 ----------
  const fsBtn = document.getElementById('fullscreenBtn');
  const fsEnterIcon = document.getElementById('fsEnterIcon');
  const fsExitIcon = document.getElementById('fsExitIcon');

  function isFullscreen(){
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
  }

  function enterFullscreen(){
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if(fn) fn.call(el);
  }

  function exitFullscreen(){
    const fn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if(fn) fn.call(document);
  }

  function updateFullscreenIcon(){
    const fs = isFullscreen();
    fsEnterIcon.style.display = fs ? 'none' : '';
    fsExitIcon.style.display = fs ? '' : 'none';
    fsBtn.setAttribute('aria-label', fs ? '전체화면 해제' : '전체화면');
  }

  fsBtn.addEventListener('click', () => {
    if(isFullscreen()) exitFullscreen();
    else enterFullscreen();
  });

  ['fullscreenchange', 'webkitfullscreenchange', 'msfullscreenchange'].forEach(evt => {
    document.addEventListener(evt, updateFullscreenIcon);
  });
  updateFullscreenIcon();

  // 급식 정보를 가져오는 Cloudflare Worker 주소
  const WORKER_URL = "https://class-clock.snackcandy105.workers.dev/";

  // =========================================================
  // [임시/테스트용] 디버그 콘솔 — 배포 전 삭제하거나 그대로 둬도 무방합니다.
  // 브라우저 개발자도구 콘솔(F12)에서 아래처럼 사용하세요.
  //   setDebugTime('수', '09:15')             // 요일만 지정(가까운 수요일), 1배속으로 흐름
  //   setDebugTime('금', '14:55', 30)         // 요일 + 30배속으로 빠르게 흐름
  //   setDebugTime('2026-11-25', '13:00')     // 실제 날짜 지정 (급식 등 날짜별 데이터 테스트용)
  //   setDebugTime('2026-12-25', '08:00', 60) // 특정 날짜 + 배속
  //   clearDebugTime()                        // 실제 현재 시간으로 복귀
  // =========================================================
  let DEBUG_OVERRIDE = null;
  const DAY_NAME_TO_INDEX = {'일':0,'월':1,'화':2,'수':3,'목':4,'금':5,'토':6};

  function setDebugTime(dayOrDate, timeStr, speed){
    if(speed === undefined) speed = 1;
    const parts = timeStr.split(':').map(Number);
    const hh = parts[0], mm = parts[1], ss = parts[2] || 0;

    let ref, label;
    if(typeof dayOrDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dayOrDate)){
      // 실제 날짜 지정 (급식 등 날짜별 데이터 테스트용) 예: setDebugTime('2026-11-25','13:00')
      ref = new Date(dayOrDate + 'T00:00:00');
      ref.setHours(hh, mm, ss, 0);
      label = `${dayOrDate} (${['일','월','화','수','목','금','토'][ref.getDay()]}요일)`;
    } else {
      // 요일만 지정 (시간표 테스트용) 예: setDebugTime('수','09:15')
      const jsDay = typeof dayOrDate === 'number' ? dayOrDate : DAY_NAME_TO_INDEX[dayOrDate];
      ref = new Date();
      ref.setDate(ref.getDate() + (jsDay - ref.getDay()));
      ref.setHours(hh, mm, ss, 0);
      label = `${['일','월','화','수','목','금','토'][jsDay]}요일`;
    }

    DEBUG_OVERRIDE = { base: ref, realStart: Date.now(), speed: speed };
    console.log(`[디버그] ${label} ${timeStr}로 설정, 배속 x${speed}`);
  }

  function clearDebugTime(){
    DEBUG_OVERRIDE = null;
    console.log('[디버그] 해제 — 실제 현재 시간으로 복귀합니다.');
  }

  window.setDebugTime = setDebugTime;
  window.clearDebugTime = clearDebugTime;

  function getNow(){
    if(DEBUG_OVERRIDE){
      const elapsed = (Date.now() - DEBUG_OVERRIDE.realStart) * DEBUG_OVERRIDE.speed;
      return new Date(DEBUG_OVERRIDE.base.getTime() + elapsed);
    }
    return new Date();
  }

  // ---------- 시계 ----------
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  const weekdays = ['일', '월', '화', '수', '목', '금', '토'];

  function pad(n){ return String(n).padStart(2, '0'); }

  function tick(){
    const now = getNow();
    timeEl.textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    dateEl.textContent =
      `${now.getFullYear()}. ${pad(now.getMonth()+1)}. ${pad(now.getDate())}. ${weekdays[now.getDay()]}요일`;
    updateDday(now);
    updateSchedule(now);
    checkMealAutoSwitch(now);
    refreshMealsIfNewDay(now);
  }

  function refreshMealsIfNewDay(now){
    const ymd = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
    if(ymd !== lastMealFetchDate) fetchMeals(now);
  }

  // ---------- D-day ----------
  function updateDday(now){
    const target = new Date(TARGET_DATE + "T00:00:00");
    const today = new Date(now);
    today.setHours(0,0,0,0);
    const diff = Math.round((target - today) / 86400000);

    const valueEl = document.getElementById('ddayValue');
    const captionEl = document.getElementById('ddayCaption');

    if(diff > 0) valueEl.textContent = `D-${diff}`;
    else if(diff === 0) valueEl.textContent = `D-DAY`;
    else valueEl.textContent = `D+${Math.abs(diff)}`;

    const [y, m, d] = TARGET_DATE.split('-');
    captionEl.textContent = `${y}.${m}.${d}`;
  }

  // ---------- 시간표----------
  function toSec(hhmm){
    const p = hhmm.split(':').map(Number);
    return p[0]*3600 + p[1]*60;
  }

  const MON_TUE = [
    {s:'08:00', e:'08:20', label:'아침 조회'},
    {s:'08:20', e:'09:10', label:'1교시'},
    {s:'09:10', e:'09:20', label:'쉬는 시간'},
    {s:'09:20', e:'10:10', label:'2교시'},
    {s:'10:10', e:'10:20', label:'쉬는 시간'},
    {s:'10:20', e:'11:10', label:'3교시'},
    {s:'11:10', e:'11:20', label:'쉬는 시간'},
    {s:'11:20', e:'12:10', label:'4교시'},
    {s:'12:10', e:'13:10', label:'점심 시간'},
    {s:'13:10', e:'14:00', label:'5교시'},
    {s:'14:00', e:'14:10', label:'쉬는 시간'},
    {s:'14:10', e:'15:00', label:'6교시'},
    {s:'15:00', e:'15:10', label:'쉬는 시간'},
    {s:'15:10', e:'16:00', label:'7교시'},
  ];
  const WED_THU = MON_TUE.slice(0, 12); // 6교시(15:00)까지만
  const FRI = [
    {s:'08:00', e:'08:20', label:'아침 조회'},
    {s:'08:20', e:'09:10', label:'1교시'},
    {s:'09:10', e:'09:20', label:'쉬는 시간'},
    {s:'09:20', e:'10:10', label:'2교시'},
    {s:'10:10', e:'10:20', label:'쉬는 시간'},
    {s:'10:20', e:'11:10', label:'3교시'},
    {s:'11:10', e:'11:20', label:'쉬는 시간'},
    {s:'11:20', e:'12:10', label:'4교시'},
    {s:'12:10', e:'13:20', label:'점심 시간'},
    {s:'13:20', e:'15:00', label:'자율'},
  ];

  // schoolIndex: 월=0, 화=1, 수=2, 목=3, 금=4, 토=5, 일=6 (요일 순서대로 이어붙이기 위함)
  const SCHEDULE_BY_SCHOOL_INDEX = [MON_TUE, MON_TUE, WED_THU, WED_THU, FRI, [], []];

  const WEEK_EVENTS = [];
  SCHEDULE_BY_SCHOOL_INDEX.forEach((day, idx) => {
    day.forEach(seg => {
      WEEK_EVENTS.push({
        start: idx * 86400 + toSec(seg.s),
        end: idx * 86400 + toSec(seg.e),
        label: seg.label
      });
    });
  });
  WEEK_EVENTS.sort((a, b) => a.start - b.start);
  const WEEK_SECONDS = 7 * 86400;

  function jsDayToSchoolIndex(jsDay){ return (jsDay + 6) % 7; } // 일(0)->6, 월(1)->0 ...

  function formatRemain(totalSec){
    totalSec = Math.max(0, Math.round(totalSec));
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if(h > 0) return `${h}:${pad(m)}:${pad(s)}`;
    return `${m}:${pad(s)}`;
  }

  const countdownEl = document.getElementById('countdown');
  const nextClassEl = document.getElementById('nextClassValue');
  const nextClassBoxEl = document.querySelector('.next-class');
  const statusEl = document.getElementById('statusValue');

  function updateSchedule(now){
    const nowAbs = jsDayToSchoolIndex(now.getDay()) * 86400
      + now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

    const currentIdx = WEEK_EVENTS.findIndex(ev => nowAbs >= ev.start && nowAbs < ev.end);

    if(currentIdx !== -1){
      // 지금 교시/쉬는시간/자율 등 정해진 일정 안에 있음 → 해당 일정이 끝날 때까지 카운트
      const current = WEEK_EVENTS[currentIdx];
      const remain = current.end - nowAbs;
      const next = WEEK_EVENTS[(currentIdx + 1) % WEEK_EVENTS.length];
      // 다음 일정이 현재 일정 바로 뒤에 이어지지 않고 하루가 끝나는 경우(=그 사이가 자습) 라면
      // 다음날 첫 일정(예: 아침 조회) 대신 "자습"이라고 표시
      const isBackToBack = next.start === current.end;

      statusEl.textContent = current.label;
      countdownEl.textContent = `남은 시간: ${formatRemain(remain)}`;
      nextClassEl.textContent = isBackToBack ? next.label : '자습';

      countdownEl.classList.remove('hidden');
      nextClassBoxEl.classList.remove('hidden');
    } else {
      // 정해진 일정 사이(=자습, 주말 등) → 다음 일정과 카운트다운을 숨김
      statusEl.textContent = '자습';
      countdownEl.classList.add('hidden');
      nextClassBoxEl.classList.add('hidden');
    }
  }

  // ---------- 공지 / 청소 패널 ----------
  const defaults = {
    notice: '공지 사항이 없습니다.',
    cleaning: '청소 당번 입력.'
  };

  document.querySelectorAll('.panel').forEach(panel => {
    const key = panel.dataset.key;
    const storageKey = `board_${key}`;
    const editBtn = panel.querySelector('[data-edit]');
    const collapseBtn = panel.querySelector('[data-collapse]');
    const display = panel.querySelector('[data-display]');
    const input = panel.querySelector('[data-input]');

    const saved = localStorage.getItem(storageKey);
    display.textContent = saved !== null ? saved : defaults[key];

    function closeEditIfOpen(){
      if(!input.hidden){
        input.hidden = true;
        display.hidden = false;
        editBtn.textContent = '수정';
      }
    }

    // 패널 아무 곳이나 누르면 수정/화살표 버튼 노출, 열린 상태에서 다시 누르면 닫힘
    panel.addEventListener('click', (e) => {
      if(!input.hidden && e.target === input) return; // 수정 중 텍스트 입력 클릭은 무시

      if(panel.classList.contains('open')){
        closeEditIfOpen();
        panel.classList.remove('open');
      } else {
        panel.classList.add('open');
      }
    });

    // 화살표 — 다시 접어서 텍스트만 보이게
    collapseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      closeEditIfOpen();
      panel.classList.remove('open');
    });

    // 수정 / 저장
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const editing = !input.hidden;

      if(!editing){
        input.value = display.textContent;
        display.hidden = true;
        input.hidden = false;
        input.focus();
        editBtn.textContent = '저장';
      } else {
        const value = input.value.trim() || defaults[key];
        display.textContent = value;
        localStorage.setItem(storageKey, value);
        display.hidden = false;
        input.hidden = true;
        editBtn.textContent = '수정';
      }
    });
  });

  // ---------- 급식 ----------
  const mealLabelEl = document.getElementById('mealLabel');
  const mealMenuEl = document.getElementById('mealMenu');
  let mealState = computeAutoMeal(getNow());

  // undefined = 아직 안 불러옴, null = 데이터 없음/오류, 배열 = 메뉴 목록
  const mealData = { lunch: undefined, dinner: undefined };
  let lastMealFetchDate = null;

  function computeAutoMeal(now){
    const totalMin = now.getHours() * 60 + now.getMinutes();
    return totalMin >= (12 * 60 + 40) ? 'dinner' : 'lunch';
  }

  // NEIS DDISH_NM은 "메뉴1(1.2.5.)<br/>메뉴2(6.)" 형태 → 줄바꿈으로 나누고 알레르기 표기 제거
  function parseMenu(row){
    if(!row || !row.DDISH_NM) return null;
    const items = row.DDISH_NM
      .split(/<br\s*\/?>/i)
      .map(item => item.replace(/\([^)]*\)/g, '').trim())
      .filter(Boolean);
    return items.length ? items : null;
  }

  async function fetchMeals(now){
    const ymd = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}`;
    lastMealFetchDate = ymd; // 먼저 표시해서 같은 날 중복 요청 방지
    mealData.lunch = undefined;
    mealData.dinner = undefined;
    renderMeal();

    try{
      const res = await fetch(`${WORKER_URL}?date=${ymd}`);
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const rows = (data.mealServiceDietInfo && data.mealServiceDietInfo[1] && data.mealServiceDietInfo[1].row) || [];
      mealData.lunch = parseMenu(rows.find(r => r.MMEAL_SC_CODE === '2'));
      mealData.dinner = parseMenu(rows.find(r => r.MMEAL_SC_CODE === '3'));
    } catch(err){
      console.error('급식 정보를 불러오지 못했습니다.', err);
      mealData.lunch = null;
      mealData.dinner = null;
    }
    renderMeal();
  }

  function renderMeal(){
    mealLabelEl.textContent = mealState === 'lunch' ? '중식' : '석식';
    const menu = mealState === 'lunch' ? mealData.lunch : mealData.dinner;

    mealMenuEl.innerHTML = '';
    if(menu === undefined){
      mealMenuEl.textContent = '불러오는 중...';
    } else if(menu === null){
      mealMenuEl.textContent = '급식 정보 없음';
    } else {
      menu.forEach(item => {
        const line = document.createElement('div');
        line.textContent = item;
        mealMenuEl.appendChild(line);
      });
    }
  }
  renderMeal();

  document.querySelectorAll('[data-meal-nav]').forEach(btn => {
    btn.addEventListener('click', () => {
      mealState = mealState === 'lunch' ? 'dinner' : 'lunch';
      renderMeal();
    });
  });

  // 12:40에 자동으로 석식, 자정에 자동으로 중식으로 전환
  function checkMealAutoSwitch(now){
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    if(h === 12 && m === 40 && s === 0 && mealState !== 'dinner'){
      mealState = 'dinner';
      renderMeal();
    }
    if(h === 0 && m === 0 && s === 0 && mealState !== 'lunch'){
      mealState = 'lunch';
      renderMeal();
    }
  }

  // ---------- 시작 ----------
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
